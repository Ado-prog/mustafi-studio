<style>
  :root {
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --faint: #86868b;
    --bg: #ffffff;
    --gray: #f5f5f7;
    --line: #d2d2d7;
    --red: #e31e24;
    --red-dark: #c4161c;
    --red-light: #ff4f55;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
    --ease: cubic-bezier(.28, .11, .32, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 44px; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: -.022em; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img, video { display: block; max-width: 100%; }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  .wrap { width: min(980px, 100% - 32px); margin-inline: auto; }

  /* Globalna navigacija */
  .gnav { position: sticky; top: 0; z-index: 50; height: 44px; background: rgba(250, 250, 252, .8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0, 0, 0, .06); }
  .gnav .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .gnav .brand img { height: 18px; width: auto; }
  .gnav ul { display: flex; gap: 34px; list-style: none; font-size: 12px; letter-spacing: -.01em; }
  .gnav ul a { color: rgba(0, 0, 0, .8); transition: color .2s; }
  .gnav ul a:hover { color: #000; }
  .gnav .right { display: flex; align-items: center; gap: 14px; }
  .langs { display: flex; gap: 2px; }
  .langs button { background: none; border: 0; font-size: 11px; font-weight: 500; color: var(--faint); padding: 3px 5px; border-radius: 4px; cursor: pointer; }
  .langs button.active { color: var(--ink); background: rgba(0, 0, 0, .06); }
  .gnav .cta { font-size: 12px; font-weight: 500; background: var(--red); color: #fff; padding: 4px 11px; border-radius: 980px; }
  .menu-btn { display: none; background: none; border: 0; width: 32px; height: 32px; cursor: pointer; position: relative; }
  .menu-btn span, .menu-btn::before { content: ""; position: absolute; left: 9px; right: 9px; height: 1.2px; background: var(--ink); transition: transform .3s var(--ease); }
  .menu-btn::before { top: 12px; } .menu-btn span { top: 19px; }
  .menu-open .menu-btn::before { transform: translateY(3.5px) rotate(45deg); }
  .menu-open .menu-btn span { transform: translateY(-3.5px) rotate(-45deg); }

  /* Pločice */
  .tiles { display: grid; gap: 12px; padding: 12px; }
  .tile { position: relative; overflow: hidden; height: 692px; text-align: center; background: var(--gray) center bottom / cover no-repeat; display: flex; flex-direction: column; align-items: center; }
  .tile.dark { background-color: #000; color: #f5f5f7; }
  .tile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--fade) 0%, var(--fade) 18%, transparent 55%); pointer-events: none; --fade: rgba(245, 245, 247, .96); }
  .tile.dark::before { --fade: rgba(0, 0, 0, .88); }
  .tile .txt { position: relative; z-index: 1; padding: 52px 20px 0; }
  .tile h2 { font-size: 56px; line-height: 1.07; font-weight: 600; letter-spacing: -.005em; }
  .tile h3 { font-size: 28px; line-height: 1.14; font-weight: 400; letter-spacing: .007em; margin-top: 6px; }
  .tile p.sub { font-size: 21px; line-height: 1.38; margin-top: 4px; max-width: 34ch; margin-inline: auto; }
  .tile .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .pill { display: inline-block; font-size: 17px; line-height: 1.17; padding: 11px 21px; border-radius: 980px; border: 1px solid var(--red); background: var(--red); color: #fff; transition: background .2s, color .2s, border-color .2s; cursor: pointer; }
  .pill:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .pill.ghost { background: transparent; color: var(--red); }
  .pill.ghost:hover { background: var(--red); color: #fff; }
  .dark .pill.ghost { color: var(--red-light); border-color: var(--red-light); }
  .dark .pill.ghost:hover { background: var(--red-light); color: #000; }
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile-grid .tile { height: 580px; }
  .tile-grid .tile h2 { font-size: 40px; line-height: 1.1; }
  .tile-grid .tile p.sub { font-size: 19px; }
  .tile-grid .tile .pill { font-size: 14px; padding: 8px 15px; }

  /* Hero */
  .hero::before { display: none; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#000 0%, rgba(0, 0, 0, .8) 32%, rgba(0, 0, 0, .1) 68%, rgba(0, 0, 0, .35) 100%); }
  .hero .txt { padding-top: 60px; }
  .hero .mark { width: 92px; height: auto; margin: 0 auto 18px; }
  .hero h1 { font-size: 80px; line-height: 1.05; font-weight: 600; letter-spacing: -.015em; }
  .hero .tagline { font-size: 21px; color: var(--red-light); font-weight: 500; margin-top: 2px; }
  .hero p.sub { color: #a1a1a6; max-width: 40ch; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { .hero video { display: none; } .hero { background: #000 url(img/hero-poster.jpg) center 60% / cover; } }

  /* Sekcije */
  section.block { padding: 110px 0; }
  section.gray { background: var(--gray); }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 40px; }
  .sec-head h2 { font-size: 48px; line-height: 1.08; font-weight: 600; letter-spacing: -.003em; }
  .sec-head h2 span { color: var(--faint); }
  .more { color: var(--red); font-size: 17px; white-space: nowrap; }
  .more:hover { text-decoration: underline; }
  .more::after { content: " ›"; }

  /* Karusel */
  .carousel { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: max(16px, calc((100vw - 980px) / 2)); padding: 10px max(16px, calc((100vw - 980px) / 2)) 30px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .card { flex: none; width: 372px; height: 500px; border-radius: 18px; overflow: hidden; position: relative; scroll-snap-align: start; background: #000; box-shadow: 2px 4px 12px rgba(0, 0, 0, .08); transition: transform .4s var(--ease), box-shadow .4s var(--ease); }
  .card:hover { transform: scale(1.015); box-shadow: 2px 4px 16px rgba(0, 0, 0, .16); }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0, 0, 0, .55), transparent 30%); }
  .card .cap { position: absolute; top: 26px; left: 26px; right: 26px; z-index: 1; color: #fff; }
  .card .cap small { display: block; font-size: 12px; font-weight: 600; opacity: .85; }
  .card .cap b { display: block; font-size: 24px; line-height: 1.17; font-weight: 600; margin-top: 4px; }
  .card.wide { width: 620px; }
  .car-ctrl { display: flex; justify-content: flex-end; gap: 14px; }
  .car-ctrl button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(210, 210, 215, .64); color: rgba(0, 0, 0, .56); font-size: 22px; line-height: 1; cursor: pointer; transition: background .2s; }
  .car-ctrl button:hover { background: rgba(223, 223, 227, .9); color: #000; }

  /* O meni */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .about .panel { background: #fff; border-radius: 18px; overflow: hidden; }
  .about .intro { padding: 48px 44px; display: flex; flex-direction: column; justify-content: center; }
  .about .intro small { font-size: 17px; font-weight: 600; color: var(--red); }
  .about .intro h3 { font-size: 40px; line-height: 1.1; font-weight: 600; margin: 8px 0 18px; }
  .about .intro p { color: var(--muted); }
  .about .intro p + p { margin-top: 12px; }
  .about .pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; min-height: 420px; }
  .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: #fff; border-radius: 18px; padding: 30px 28px; }
  .stat b { display: block; font-size: 40px; line-height: 1.1; font-weight: 600; background: linear-gradient(90deg, var(--red), #ff7a45); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat h4 { font-size: 17px; font-weight: 600; margin-top: 10px; }
  .stat span { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* Proces */
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; list-style: none; counter-reset: s; }
  .steps li { background: var(--gray); border-radius: 18px; padding: 28px 22px 32px; }
  .steps li::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 15px; font-weight: 600; margin-bottom: 26px; }
  .steps h3 { font-size: 19px; line-height: 1.2; font-weight: 600; margin-bottom: 8px; }
  .steps p { font-size: 14px; color: var(--muted); letter-spacing: -.01em; }

  /* FAQ */
  .faq { border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; padding: 24px 44px 24px 0; position: relative; font-size: 21px; font-weight: 600; line-height: 1.3; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-size: 28px; font-weight: 300; color: var(--muted); transition: transform .3s var(--ease); }
  .faq details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
  .faq details p { color: var(--muted); padding: 0 44px 26px 0; max-width: 68ch; }

  /* Kontakt */
  .contact { display: grid; grid-template-columns: 1fr 1.15fr; gap: 12px; }
  .contact .side { display: grid; gap: 12px; align-content: start; }
  .channel { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 18px; padding: 22px 24px; transition: transform .3s var(--ease), box-shadow .3s; }
  .channel:hover { transform: scale(1.01); box-shadow: 2px 4px 16px rgba(0, 0, 0, .08); }
  .channel svg { width: 30px; height: 30px; fill: var(--red); flex: none; }
  .channel small { display: block; font-size: 12px; color: var(--muted); }
  .channel strong { font-size: 19px; font-weight: 600; }
  .channel .arr { margin-left: auto; color: var(--faint); font-size: 22px; }
  .form { background: #fff; border-radius: 18px; padding: 40px; }
  .form h3 { font-size: 32px; line-height: 1.12; font-weight: 600; }
  .form > p { color: var(--muted); font-size: 15px; margin: 6px 0 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chips label { cursor: pointer; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips span { display: inline-block; padding: 8px 15px; border-radius: 980px; border: 1px solid var(--line); font-size: 14px; transition: all .2s; }
  .chips input:checked + span { border-color: var(--red); background: rgba(227, 30, 36, .07); color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .chips input:focus-visible + span { outline: 2px solid #0071e3; outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px 2px; }
  .field input, .field select, .field textarea { width: 100%; height: 52px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; font-size: 17px; transition: border-color .2s, box-shadow .2s; }
  .field textarea { height: auto; min-height: 96px; padding: 14px 16px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0, 113, 227, .15); }
  .form .pill { width: 100%; margin-top: 8px; }
  .form .note { text-align: center; color: var(--faint); font-size: 12px; margin-top: 12px; }

  /* Footer */
  footer { background: var(--gray); color: var(--muted); font-size: 12px; letter-spacing: -.01em; padding: 30px 0 22px; }
  footer .note { padding-bottom: 16px; border-bottom: 1px solid var(--line); line-height: 1.6; }
  .fcols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .fcols h4 { color: var(--ink); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .fcols a { display: block; margin-bottom: 7px; }
  .fcols a:hover { color: var(--ink); text-decoration: underline; }
  .flegal { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 16px; }

  /* Provjera datuma */
  .check { background: var(--gray); text-align: center; padding: 40px 20px 44px; }
  .check h2 { font-size: 32px; line-height: 1.12; font-weight: 600; }
  .check p { color: var(--muted); margin-top: 4px; }
  .check form { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .check input { height: 46px; min-width: 210px; border: 1px solid var(--line); border-radius: 980px; padding: 0 20px; background: #fff; font-size: 17px; }
  .check input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0, 113, 227, .15); }

  /* Dostupnost */
  .skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; }
  .skip:focus { top: 8px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #0071e3; outline-offset: 3px; border-radius: 4px; }

  /* Traka na mobitelu */
  .mbar { display: none; }
  @media (max-width: 600px) {
    .mbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(250, 250, 252, .86); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid rgba(0, 0, 0, .08); transition: transform .35s var(--ease); }
    .mbar .pill { text-align: center; padding: 11px 10px; }
    .mbar.away { transform: translateY(110%); }
    body { padding-bottom: 70px; }
  }

  /* Animacije */
  .js .reveal { opacity: 0; transform: translateY(30px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
  .js .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .js .reveal { opacity: 1; transform: none; } html { scroll-behavior: auto; } }

  @media (max-width: 1068px) {
    .tile { height: 620px; }
    .tile h2 { font-size: 48px; }
    .hero h1 { font-size: 64px; }
    .tile-grid .tile { height: 500px; }
    .tile-grid .tile h2 { font-size: 32px; }
    .steps { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 834px) {
    .gnav ul { display: none; position: fixed; top: 44px; left: 0; right: 0; bottom: 0; flex-direction: column; gap: 0; background: rgba(250, 250, 252, .98); padding: 18px 32px; }
    .menu-open .gnav ul { display: flex; }
    .gnav ul a { display: block; padding: 8px 0; font-size: 28px; font-weight: 600; color: var(--ink); }
    .menu-btn { display: block; }
    .gnav .cta { display: none; }
    .tile-grid, .about, .contact { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .sec-head h2 { font-size: 40px; }
    .card, .card.wide { width: 300px; height: 420px; }
  }
  @media (max-width: 600px) {
    .tiles { padding: 0; }
    .tile { height: 560px; }
    .tile .txt { padding-top: 44px; }
    .tile h2, .tile-grid .tile h2 { font-size: 32px; }
    .tile h3 { font-size: 21px; }
    .tile p.sub, .tile-grid .tile p.sub { font-size: 17px; }
    .tile-grid .tile { height: 500px; }
    .pill { font-size: 15px; padding: 9px 18px; }
    .hero { height: 640px; }
    .hero h1 { font-size: 44px; }
    .hero .mark { width: 72px; }
    .hero .tagline { font-size: 17px; }
    section.block { padding: 72px 0; }
    .sec-head { flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 28px; }
    .sec-head h2 { font-size: 32px; }
    .about .intro { padding: 32px 26px; }
    .about .intro h3 { font-size: 32px; }
    .stat { padding: 22px 20px; }
    .stat b { font-size: 30px; }
    .steps { grid-template-columns: 1fr; }
    .steps li { display: grid; grid-template-columns: 34px 1fr; column-gap: 16px; padding: 22px 20px; }
    .steps li::before { grid-row: span 2; margin: 0; }
    .form { padding: 28px 20px; }
    .row { grid-template-columns: 1fr; gap: 0; }
    .faq summary { font-size: 18px; }
    .faq details p { padding-right: 0; }
    .fcols { grid-template-columns: 1fr 1fr; }
    .langs button { padding: 3px 4px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>

<nav class="gnav">
  <div class="wrap">
    <a href="#" class="brand" aria-label="Mustafi Studio"><img src="img/logo_mark.png" alt="Mustafi Studio" width="900" height="409"></a>
    <ul id="menu">
      <li><a href="#services" data-i="nav_services"></a></li>
      <li><a href="#portfolio" data-i="nav_portfolio"></a></li>
      <li><a href="#about" data-i="nav_about"></a></li>
      <li><a href="#process" data-i="nav_process"></a></li>
      <li><a href="#faq" data-i="nav_faq"></a></li>
      <li><a href="#contact" data-i="nav_contact"></a></li>
    </ul>
    <div class="right">
      <div class="langs" id="langs"><button data-l="de">DE</button><button data-l="sq">SQ</button><button data-l="bs">BS</button><button data-l="en">EN</button></div>
      <a class="cta" href="#contact" data-i="nav_cta"></a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><span></span></button>
    </div>
  </div>
</nav>

<main id="main">
  <div class="tiles">
    <section class="tile dark hero">
      <video autoplay muted loop playsinline preload="auto" poster="img/hero-poster.jpg" aria-hidden="true"><source src="img/hero.mp4" type="video/mp4"></video>
      <div class="txt reveal">
        <img class="mark" src="img/logo_mark.png" alt="" width="900" height="409">
        <h1>Mustafi Studio</h1>
        <p class="tagline">Your Photo and Videographer</p>
        <h3 data-i="hero_title"></h3>
        <p class="sub" data-i="hero_text"></p>
        <div class="links">
          <a class="pill" href="#contact" data-i="hero_cta"></a>
          <a class="pill ghost" href="#portfolio" data-i="hero_cta2"></a>
        </div>
      </div>
    </section>

    <section class="check">
      <h2 data-i="chk_title"></h2>
      <p data-i="chk_sub"></p>
      <form id="dateCheck">
        <input id="chkDate" type="date" required aria-label="Datum">
        <button class="pill" type="submit" data-i="chk_btn"></button>
      </form>
    </section>

    <section class="tile" id="services" style="background-image:url(img/pf/w4.jpg)">
      <div class="txt reveal">
        <h2 data-i="s1_t"></h2>
        <p class="sub" data-i="s1_p"></p>
        <div class="links"><a class="pill" href="#contact" data-i="lk_ask"></a><a class="pill ghost" href="#portfolio" data-i="lk_see"></a></div>
      </div>
    </section>

let lang = "de";
function setLang(l) {
  if (!T[l]) l = "de";
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = T[l][el.dataset.i] ?? ""; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("active", b.dataset.l === l));
  try { localStorage.setItem("lang", l); } catch (e) {}
}

// Karusel
const grid = document.getElementById("grid");
PHOTOS.forEach(([f, cat, size]) => {
  const a = document.createElement("a");
  a.href = INSTAGRAM; a.target = "_blank"; a.rel = "noopener";
  a.className = "card" + (size ? " " + size : "");
  a.innerHTML = `<img src="img/pf/${f}.jpg" alt="Mustafi Studio" loading="lazy"><div class="cap"><small data-i="${cat}"></small><b>Mustafi Studio</b></div>`;
  grid.appendChild(a);
});
const step = () => grid.querySelector(".card").offsetWidth + 20;
document.getElementById("prev").onclick = () => grid.scrollBy({ left: -step(), behavior: "smooth" });
document.getElementById("next").onclick = () => grid.scrollBy({ left: step(), behavior: "smooth" });

document.querySelectorAll("#langs button").forEach(b => b.onclick = () => setLang(b.dataset.l));
let start = "";
try { start = localStorage.getItem("lang") || ""; } catch (e) {}
if (!start) start = { de: "de", sq: "sq", bs: "bs", sr: "bs", hr: "bs", en: "en" }[(navigator.language || "de").slice(0, 2)] || "de";
setLang(start);

// Upit preko WhatsAppa
document.getElementById("inquiry").onsubmit = e => {
  e.preventDefault();
  const t = T[lang], v = id => document.getElementById(id).value.trim();
  const picked = [...document.querySelectorAll("#chips input:checked")].map(i => t[i.value]);
  const lines = [`${t.wa_hi} ${picked.length ? picked.join(", ") : t.wa_any}.`];
  if (v("fDate")) lines.push(`${t.wa_date}: ${v("fDate").split("-").reverse().join(".")}`);
  if (v("fPlace")) lines.push(`${t.wa_place}: ${v("fPlace")}`);
  if (v("fMsg")) lines.push("", v("fMsg"));
  if (v("fName")) lines.push("", `${t.wa_name}: ${v("fName")}`);
  window.open(`https://wa.me/${v("fTo")}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank", "noopener");
};

// Provjera datuma
document.getElementById("dateCheck").onsubmit = e => {
  e.preventDefault();
  const d = document.getElementById("chkDate").value.split("-").reverse().join(".");
  window.open(`https://wa.me/41798288648?text=${encodeURIComponent(`${T[lang].chk_msg} ${d}?`)}`, "_blank", "noopener");
};

// Traka na mobitelu se skriva kod kontakta
const mbar = document.getElementById("mbar");
if ("IntersectionObserver" in window) new IntersectionObserver(es => mbar.classList.toggle("away", es[0].isIntersecting)).observe(document.getElementById("contact"));

// Navigacija
const menuBtn = document.getElementById("menuBtn");
menuBtn.onclick = () => menuBtn.setAttribute("aria-expanded", document.body.classList.toggle("menu-open"));
document.querySelectorAll("#menu a").forEach(a => a.onclick = () => { document.body.classList.remove("menu-open"); menuBtn.setAttribute("aria-expanded", "false"); });
document.getElementById("year").textContent = new Date().getFullYear();

if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
} else document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
</script>
