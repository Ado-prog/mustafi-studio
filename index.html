<style>
  :root {
    --bg: #0f0f10;
    --bg-2: #17171a;
    --line: #2a2a2e;
    --text: #f2f0ec;
    --muted: #a8a49c;
    --red: #e31e24;
    --red-dark: #a50e14;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(1200px, 100% - 32px); margin-inline: auto; }

  /* Navigation */
  header { position: fixed; inset: 0 0 auto; z-index: 50; transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
  header.scrolled { background: rgba(15,15,16,.92); backdrop-filter: blur(10px); border-color: var(--line); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 16px; }
  .nav .brand img { height: 40px; width: auto; }
  .nav ul { display: flex; gap: 28px; list-style: none; font-size: 14px; letter-spacing: .04em; }
  .nav ul a { color: var(--muted); transition: color .2s; }
  .nav ul a:hover { color: var(--text); }
  .langs { display: flex; gap: 4px; }
  .langs button { background: none; border: 1px solid transparent; color: var(--muted); font: 600 12px var(--sans); letter-spacing: .06em; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .langs button.active { color: var(--text); border-color: var(--line); }
  .menu-btn { display: none; background: none; border: 0; color: var(--text); font-size: 26px; cursor: pointer; }

  /* Hero */
  .hero { min-height: 100vh; display: grid; align-content: center; position: relative; overflow: hidden; background: #0b0c0c url(img/hero-poster.jpg) center / cover; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,11,.92) 0%, rgba(10,10,11,.75) 45%, rgba(10,10,11,.35) 100%), linear-gradient(0deg, var(--bg) 0%, transparent 25%); }
  .hero-text { position: relative; z-index: 1; padding: 120px 48px 64px max(16px, calc((100vw - 1200px) / 2)); }
  @media (prefers-reduced-motion: reduce) { .hero video { display: none; } }
  .hero-logo { display: block; width: min(420px, 100%); height: auto; margin-bottom: 14px; }
  .hero h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(38px, 5vw, 64px); line-height: 1.08; margin-bottom: 20px; }
  .hero h1 em { color: var(--red); }
  .hero p { color: var(--muted); max-width: 46ch; font-size: 17px; margin-bottom: 36px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 14px 26px; border-radius: 2px; font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; transition: background .2s, border-color .2s; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: var(--red-dark); }
  .btn-line { border: 1px solid var(--line); }
  .btn-line:hover { border-color: var(--text); }

  /* Sections */
  section { padding: 110px 0; }
  .eyebrow { color: var(--red); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 14px; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 4vw, 48px); line-height: 1.1; margin-bottom: 18px; }
  .lead { color: var(--muted); max-width: 60ch; font-size: 17px; }

  /* Services */
  .services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 56px; }
  .service { background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }
  .service .ph { aspect-ratio: 4 / 5; background-size: cover; background-position: center; transition: transform .6s; }
  .service:hover .ph { transform: scale(1.04); }
  .service div.txt { padding: 22px 22px 26px; position: relative; background: var(--bg-2); }
  .service h3 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin-bottom: 8px; }
  .service p { color: var(--muted); font-size: 14.5px; }

  /* Kako radim */
  #process { background: var(--bg-2); border-block: 1px solid var(--line); }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-top: 56px; counter-reset: step; list-style: none; }
  .steps li { position: relative; padding-top: 22px; border-top: 1px solid var(--line); }
  .steps li::before { counter-increment: step; content: "0" counter(step); display: block; font-family: var(--serif); font-size: 40px; line-height: 1; color: var(--red); margin-bottom: 14px; }
  .steps li::after { content: ""; position: absolute; top: -1px; left: 0; width: 40px; height: 2px; background: var(--red); }
  .steps h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .steps p { color: var(--muted); font-size: 14.5px; }

  /* FAQ */
  .faq { max-width: 820px; margin-top: 40px; }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; padding: 22px 40px 22px 0; position: relative; font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-family: var(--sans); font-weight: 400; font-size: 26px; color: var(--red); transition: transform .3s; }
  .faq details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
  .faq details p { color: var(--muted); padding: 0 40px 24px 0; max-width: 64ch; }

  /* Portfolio */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 40px 0 28px; }
  .filters button { background: none; border: 1px solid var(--line); color: var(--muted); font: 500 13px var(--sans); letter-spacing: .04em; padding: 9px 18px; border-radius: 999px; cursor: pointer; transition: all .2s; }
  .filters button.active, .filters button:hover { color: var(--text); border-color: var(--red); }
  .grid { columns: 3 300px; column-gap: 14px; }
  .grid figure { break-inside: avoid; margin-bottom: 14px; position: relative; overflow: hidden; background: var(--bg-2); }
  .grid figure a { display: block; }
  .grid figure img { width: 100%; height: auto; transition: transform .5s; }
  .grid figure:hover img { transform: scale(1.04); }
  .grid figure span { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 40px 14px 12px; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: linear-gradient(transparent, rgba(0,0,0,.7)); opacity: .8; transition: opacity .3s; }
  .grid figure:hover span { opacity: 1; }
  .grid figure span svg { width: 18px; height: 18px; fill: #fff; flex: none; }
  .grid figure.hide { display: none; }

  /* About */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .about-pics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .about-pics img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1; }
  .about-pics img:first-child { grid-column: 1 / -1; aspect-ratio: 3 / 2; }
  .about p + p { margin-top: 16px; }
  .gear { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .gear span { border: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 6px 12px; border-radius: 999px; }

  /* Contact */
  #contact { background: var(--bg-2); border-top: 1px solid var(--line); }
  .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
  .cards { display: grid; gap: 14px; }
  .card { display: flex; align-items: center; gap: 18px; padding: 20px 22px; border: 1px solid var(--line); background: var(--bg); transition: border-color .2s; }
  .card:hover { border-color: var(--red); }
  .card svg { width: 26px; height: 26px; flex: none; fill: var(--red); }
  .card small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .card strong { font-weight: 500; font-size: 17px; }

  footer { padding: 36px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s, transform .8s; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 960px) {
    .services { grid-template-columns: repeat(2, 1fr); }
    .steps { grid-template-columns: repeat(2, 1fr); row-gap: 36px; }
    .about, .contact { grid-template-columns: 1fr; gap: 40px; }
    .hero-text { padding: 110px 16px 48px; }
    .hero::after { background: linear-gradient(0deg, var(--bg) 0%, rgba(10,10,11,.7) 40%, rgba(10,10,11,.55) 100%); }
  }
  @media (max-width: 760px) {
    .menu-btn { display: block; }
    .nav ul { display: none; position: absolute; top: 72px; left: 0; right: 0; flex-direction: column; gap: 0; background: var(--bg); border-bottom: 1px solid var(--line); }
    .nav ul.open { display: flex; }
    .nav ul a { display: block; padding: 16px; font-size: 16px; }
    .nav .brand img { height: 32px; }
    header { background: rgba(15,15,16,.92); }
    section { padding: 80px 0; }
    .services { grid-template-columns: 1fr; }
    .steps { grid-template-columns: 1fr; }
    .faq summary { font-size: 19px; }
    .grid { columns: 2 150px; column-gap: 8px; }
    .grid figure { margin-bottom: 8px; }
  }
</style>
</head>

function setLang(l) {
  if (!T[l]) l = "de";
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = T[l][el.dataset.i] ?? ""; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("active", b.dataset.l === l));
  try { localStorage.setItem("lang", l); } catch (e) {}
}
document.querySelectorAll("#langs button").forEach(b => b.onclick = () => setLang(b.dataset.l));
let start = "de";
try { start = localStorage.getItem("lang") || ""; } catch (e) {}
if (!start) {
  const nav = (navigator.language || "de").slice(0, 2);
  start = { de: "de", sq: "sq", bs: "bs", sr: "bs", hr: "bs", en: "en" }[nav] || "de";
}
setLang(start);

const grid = document.getElementById("grid");
PHOTOS.forEach(([f, c]) => {
  const fig = document.createElement("figure");
  fig.dataset.c = c;
  fig.innerHTML = `<a href="${INSTAGRAM}" target="_blank" rel="noopener"><img src="img/pf/${f}.jpg" alt="Mustafi Studio" loading="lazy"><span>${IG_ICON}<b data-i="pf_view">${T[document.documentElement.lang].pf_view}</b></span></a>`;
  grid.appendChild(fig);
});
document.querySelectorAll("#filters button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("active", x === b));
  grid.querySelectorAll("figure").forEach(fig => fig.classList.toggle("hide", b.dataset.f !== "all" && fig.dataset.c !== b.dataset.f));
});

// Navigacija
const header = document.querySelector("header"), menu = document.getElementById("menu");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 40), { passive: true });
document.getElementById("menuBtn").onclick = () => menu.classList.toggle("open");
menu.querySelectorAll("a").forEach(a => a.onclick = () => menu.classList.remove("open"));
document.getElementById("filters").hidden = PHOTOS.length === 0;
document.getElementById("year").textContent = new Date().getFullYear();

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
